<svg xmlns='http://www.w3.org/2000/svg' width='900' height='400' viewBox='0 0 900 400' font-family='Segoe UI, Helvetica, Arial, sans-serif'><rect width='900' height='400' fill='#ffffff'/><text x='30.0' y='40.0' font-size='20' fill='#1d2433' text-anchor='start' font-weight='600'>Where the cost-per-lead increase sits (Instant Form, Feb → Jun 2025)</text><text x='30.0' y='66.0' font-size='14' fill='#5b6475' text-anchor='start' font-weight='400'>Cost per lead rose from ₪8.78 to ₪17.74. Bars: share of the increase (log split, adds up to 100%).</text><line x1='429.8' y1='92' x2='429.8' y2='330' stroke='#5b6475' stroke-width='1'/><rect x='429.8' y='110' width='298.2' height='34' rx='3' fill='#d9662b'/><text x='30.0' y='126.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='600'>Ads cost more to show</text><text x='30.0' y='144.0' font-size='13' fill='#5b6475' text-anchor='start' font-weight='400'>CPM +65% (actual change)</text><text x='738.0' y='133.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='600'>+71%</text><rect x='429.8' y='180' width='201.6' height='34' rx='3' fill='#d9662b'/><text x='30.0' y='196.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='600'>Fewer people clicked</text><text x='30.0' y='214.0' font-size='13' fill='#5b6475' text-anchor='start' font-weight='400'>CTR -28% (actual change)</text><text x='641.4' y='203.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='600'>+48%</text><rect x='350.0' y='250' width='79.8' height='34' rx='3' fill='#2f5d8a'/><text x='30.0' y='266.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='600'>More clickers signed up</text><text x='30.0' y='284.0' font-size='13' fill='#5b6475' text-anchor='start' font-weight='400'>click-to-lead rate +14% (actual change)</text><text x='439.8' y='273.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='600'>-19%</text><rect x='429.8' y='318' width='420.0' height='6' fill='#5b6475'/><text x='429.8' y='342.0' font-size='13' fill='#5b6475' text-anchor='start' font-weight='400'>Total: 100% = the full increase (cost per lead doubled)</text><text x='30.0' y='372.0' font-size='13' fill='#5b6475' text-anchor='start' font-weight='400'>An arithmetic split of CPL = (CPM ÷ 1,000) ÷ CTR ÷ click-to-lead rate. It shows where the change sits, not why it happened.</text><text x='30.0' y='392.0' font-size='12' fill='#5b6475' text-anchor='start' font-weight='400'>Source: Meta Ads export, BigQuery query D1.</text></svg>